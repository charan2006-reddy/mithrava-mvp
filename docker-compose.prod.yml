# =============================================================================
# Mithrava Production Docker Compose
# =============================================================================
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Differences from docker-compose.yml:
#   - NO exposed ports for Postgres/Redis (internal only)
#   - Resource limits on all services
#   - Stricter restart policies
#   - No volume mounts for local code (uses built images only)
#   - Environment passed via .env.prod file
# =============================================================================

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mithrava-postgres
    restart: always
    # NO ports exposed — only accessible via internal network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - mithrava-network

  redis:
    image: redis:7-alpine
    container_name: mithrava-redis
    restart: always
    # NO ports exposed — only accessible via internal network
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - mithrava-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mithrava-backend
    restart: always
    # NO ports exposed — nginx handles external traffic
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: warning
      LOG_FORMAT: json
      CORS_ORIGINS: ${CORS_ORIGINS}
      SECRET_KEY: ${SECRET_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - mithrava-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: mithrava-frontend
    restart: always
    # NO ports exposed — nginx handles external traffic
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - mithrava-network

  nginx:
    image: nginx:1.25-alpine
    container_name: mithrava-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - mithrava-network

volumes:
  postgres_data:
  redis_data:
  upload_data:
  nginx_certs:

networks:
  mithrava-network:
    driver: bridge
