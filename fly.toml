# =============================================================================
# Mithrava Backend — Fly.io Configuration
# Deploy: fly deploy (from project root)
# =============================================================================

# Generate app name: fly launch --copy-config --name mithrava-api
app = "mithrava-api"
primary_region = "sin"  # Singapore (closest to India)

# ─── Build Settings ──────────────────────────────────────────────────────────
[build]
  # Fly.io will build from backend/Dockerfile
  dockerfile = "backend/Dockerfile"

# ─── Environment Variables ───────────────────────────────────────────────────
# Set these via: fly secrets set KEY=VALUE
# NEVER put secrets in fly.toml — use `fly secrets` instead

[env]
  PORT = "8080"
  LOG_LEVEL = "info"
  LOG_FORMAT = "text"
  PYTHONPATH = "/app"

# ─── HTTP Service ────────────────────────────────────────────────────────────
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true     # Stop when idle (saves free allowance)
  auto_start_machines = true    # Auto-start on request
  min_machines_running = 0      # Allow full shutdown when idle

  # Health check
  [http_service.check]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

# ─── Machine Settings ────────────────────────────────────────────────────────
[machine_configs]
  # Free tier: shared-cpu-1x with 256MB RAM
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# ─── Statics (for file uploads) ──────────────────────────────────────────────
[[mounts]]
  source = "mithrava_uploads"
  destination = "/app/uploads"
