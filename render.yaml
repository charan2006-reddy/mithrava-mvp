services:
  - type: web
    name: mithrava-backend
    runtime: docker
    repo: https://github.com/charan2006-reddy/mithrava-mvp
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        value: postgresql+asyncpg://neondb_owner:npg_8o2rSljpwbPA@ep-flat-queen-aycctcds.c-5.us-east-2.aws.neon.tech:5432/neondb?ssl=require
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://frontend-theta-six-23.vercel.app", "https://mithrava-mvp.vercel.app"]'
